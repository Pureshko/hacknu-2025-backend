services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "mytravel"
      POSTGRES_PASSWORD: "mytravel_pass"
      POSTGRES_DB: "mytravel_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mytravel -d mytravel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=mytravel
      - POSTGRES_PASSWORD=mytravel_pass
      - POSTGRES_DB=mytravel_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data: